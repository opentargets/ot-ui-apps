query GWASCredibleSetsTableQuery($variantId: String!, $size: Int!, $index: Int!) {
  variant(variantId: $variantId) {
    variantId
    referenceAllele
    alternateAllele
    gwasCredibleSets: credibleSets(
      filter: { studyTypes: [gwas] }
      page: { size: 1, index: 0 }
    ) {
      count
    }
  }
  gwasCredibleSetsByVariant(
    variantId: $variantId
    page: { size: $size, index: $index }
  ) {
    count
    rows {
      studyLocusId
      leadVariantId
      leadChromosome
      leadPosition
      leadReferenceAllele
      leadAlternateAllele
      traitFromSource
      diseaseIds
      diseaseNames
      studyId
      pValueMantissa
      pValueExponent
      beta
      posteriorProbability
      finemappingMethod
      confidence
      topL2GGeneId
      topL2GApprovedSymbol
      topL2GScore
      locusSize
    }
  }
}
